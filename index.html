<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="format-detection" content="telephone=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#7EC8E3">
<title>随便吧 — 把犹豫交给随机，把心情还给治愈</title>
<style>
/* ========== CSS Variables ========== */
:root {
  --blue-100: #E8F6FA;
  --blue-200: #C5E9F2;
  --blue-300: #A3DBEB;
  --blue-400: #7EC8E3;
  --blue-500: #5BBDD9;
  --blue-600: #3DA5C4;
  --blue-700: #2E8CAA;
  --white-85: rgba(255,255,255,0.85);
  --white-60: rgba(255,255,255,0.60);
  --white-40: rgba(255,255,255,0.40);
  --shadow-soft: 0 4px 20px rgba(126,200,227,0.15);
  --shadow-card: 0 8px 32px rgba(126,200,227,0.12);
  --shadow-btn: 0 4px 14px rgba(126,200,227,0.25);
  --radius-sm: 10px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --font-stack: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  --transition-fast: 0.2s cubic-bezier(0.4,0,0.2,1);
  --transition-smooth: 0.35s cubic-bezier(0.4,0,0.2,1);
  --transition-bounce: 0.5s cubic-bezier(0.34,1.56,0.64,1);
}

/* ========== Reset & Base ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html {
  font-size: 16px;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-stack);
  color: #3A5068;
  min-height: 100vh;
  min-height: 100dvh;
  background: linear-gradient(160deg, #E8F6FA 0%, #D4ECF4 15%, #C5E9F2 30%, #D9EFF6 45%, #E0F2F8 60%, #D0EAF3 80%, #E8F6FA 100%);
  background-attachment: fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow-x: hidden;
  position: relative;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* ========== Decorative Background Elements ========== */
.bg-decoration {
  position: fixed;
  pointer-events: none;
  z-index: 0;
  opacity: 0.5;
}

.bg-circle {
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, rgba(126,200,227,0.2), rgba(126,200,227,0.02));
}
.bg-circle-1 { width: 280px; height: 280px; top: -80px; right: -60px; }
.bg-circle-2 { width: 200px; height: 200px; bottom: 15%; left: -70px; animation: floatSlow 8s ease-in-out infinite; }
.bg-circle-3 { width: 160px; height: 160px; top: 40%; right: -50px; animation: floatSlow 10s ease-in-out infinite reverse; }
.bg-circle-4 { width: 120px; height: 120px; top: 25%; left: 10%; animation: floatSlow 7s ease-in-out infinite 1s; }

.bg-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(126,200,227,0.25);
}
.bg-dot-1 { top: 12%; left: 20%; animation: twinkle 3s ease-in-out infinite; }
.bg-dot-2 { top: 28%; right: 15%; animation: twinkle 3s ease-in-out infinite 0.8s; }
.bg-dot-3 { top: 55%; left: 12%; animation: twinkle 3s ease-in-out infinite 1.6s; }
.bg-dot-4 { top: 70%; right: 22%; animation: twinkle 3s ease-in-out infinite 2.2s; }
.bg-dot-5 { top: 18%; left: 60%; animation: twinkle 3s ease-in-out infinite 1.2s; }

@keyframes floatSlow {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-15px); }
}
@keyframes twinkle {
  0%, 100% { opacity: 0.2; transform: scale(1); }
  50% { opacity: 0.5; transform: scale(1.3); }
}

/* ========== Main Container ========== */
.app-container {
  position: relative;
  z-index: 1;
  width: 100%;
  max-width: 480px;
  padding: 20px 16px 32px;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100dvh;
}

/* ========== Header ========== */
.header {
  text-align: center;
  padding: 28px 0 20px;
  width: 100%;
}
.header-icon {
  font-size: 42px;
  margin-bottom: 8px;
  display: inline-block;
  animation: floatSlow 4s ease-in-out infinite;
}
.header h1 {
  font-size: 28px;
  font-weight: 700;
  color: #2E8CAA;
  letter-spacing: 2px;
  margin-bottom: 6px;
}
.header .slogan {
  font-size: 13px;
  color: #6BA3B8;
  font-weight: 400;
  letter-spacing: 1px;
  opacity: 0.8;
}

/* ========== Tab Navigation ========== */
.tab-nav {
  display: flex;
  background: var(--white-85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: var(--radius-xl);
  padding: 4px;
  width: 100%;
  box-shadow: var(--shadow-soft);
  position: sticky;
  top: 12px;
  z-index: 10;
  margin-bottom: 20px;
}
.tab-btn {
  flex: 1;
  padding: 10px 4px;
  border: none;
  background: transparent;
  border-radius: 28px;
  font-size: 13px;
  font-family: var(--font-stack);
  color: #6BA3B8;
  cursor: pointer;
  transition: all var(--transition-smooth);
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
  min-height: 44px;
  justify-content: center;
}
.tab-btn .tab-emoji { font-size: 18px; line-height: 1; }
.tab-btn .tab-label { font-size: 11px; line-height: 1; }
.tab-btn.active {
  background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
  color: #fff;
  box-shadow: var(--shadow-btn);
  font-weight: 600;
}

/* ========== Tab Content ========== */
.tab-content {
  width: 100%;
  display: none;
  flex-direction: column;
  align-items: center;
  animation: fadeSlideIn 0.35s ease-out;
}
.tab-content.active { display: flex; }

@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Cards ========== */
.card {
  background: var(--white-85);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-radius: var(--radius-lg);
  padding: 28px 24px;
  width: 100%;
  box-shadow: var(--shadow-card);
  display: flex;
  flex-direction: column;
  align-items: center;
  border: 1px solid rgba(255,255,255,0.6);
  margin-bottom: 16px;
}

/* ========== Random Number Tab ========== */
.number-display {
  position: relative;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  background: linear-gradient(160deg, var(--blue-100) 0%, var(--blue-200) 40%, var(--blue-300) 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 16px 0 24px;
  box-shadow: 0 0 0 8px rgba(126,200,227,0.08), 0 0 0 16px rgba(126,200,227,0.04), 0 8px 30px rgba(126,200,227,0.18);
  transition: transform var(--transition-bounce);
}
.number-display.rolling { animation: shake 0.15s ease-in-out 3; }
.number-display .number {
  font-size: 64px;
  font-weight: 700;
  color: #2E8CAA;
  font-variant-numeric: tabular-nums;
  transition: all 0.08s ease-out;
}
@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-4px); }
  75% { transform: translateX(4px); }
}

.btn {
  background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
  color: #fff;
  border: none;
  padding: 14px 36px;
  border-radius: 28px;
  font-size: 16px;
  font-family: var(--font-stack);
  font-weight: 600;
  cursor: pointer;
  box-shadow: var(--shadow-btn);
  transition: all var(--transition-fast);
  min-height: 48px;
  min-width: 44px;
  letter-spacing: 1px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
  -webkit-user-select: none;
}
.btn:active {
  transform: scale(0.96);
  box-shadow: 0 2px 8px rgba(126,200,227,0.2);
  opacity: 0.9;
}
.btn-secondary {
  background: var(--white-85);
  color: var(--blue-600);
  border: 1.5px solid var(--blue-300);
  box-shadow: none;
}

.history {
  width: 100%;
  margin-top: 24px;
}
.history-title {
  font-size: 12px;
  color: #8BB8C8;
  margin-bottom: 10px;
  letter-spacing: 1px;
  text-transform: uppercase;
  text-align: center;
}
.history-list {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
}
.history-item {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: var(--white-60);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  font-weight: 600;
  color: var(--blue-700);
  animation: popIn 0.3s ease-out;
}
@keyframes popIn {
  from { transform: scale(0); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

/* ========== Color Tab ========== */
.color-display {
  width: 160px;
  height: 160px;
  border-radius: var(--radius-lg);
  margin: 16px 0 24px;
  box-shadow: var(--shadow-card);
  transition: background-color var(--transition-smooth), transform var(--transition-bounce);
  position: relative;
  overflow: hidden;
}
.color-display::after {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0) 100%);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  pointer-events: none;
}
.color-display.color-rolling {
  animation: colorShimmer 0.3s ease-in-out infinite;
  box-shadow: 0 0 30px rgba(126,200,227,0.35), var(--shadow-card);
}
@keyframes colorShimmer {
  0%, 100% { filter: brightness(1); }
  50% { filter: brightness(1.08); }
}
.color-info {
  text-align: center;
  margin-bottom: 8px;
}
.color-name-cn {
  font-size: 20px;
  font-weight: 700;
  color: #3A5068;
  margin-bottom: 2px;
}
.color-name-en {
  font-size: 13px;
  color: #8BB8C8;
  font-style: italic;
  margin-bottom: 4px;
}
.color-hex {
  font-size: 14px;
  font-family: "SF Mono", "Consolas", monospace;
  color: #6BA3B8;
  background: var(--blue-100);
  padding: 4px 12px;
  border-radius: 12px;
  display: inline-block;
  letter-spacing: 1px;
}
.color-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  justify-content: center;
  margin-top: 12px;
}
.color-tag {
  font-size: 11px;
  padding: 4px 10px;
  border-radius: 12px;
  background: var(--blue-100);
  color: var(--blue-700);
  letter-spacing: 0.5px;
}

/* ========== Custom Picker Tab ========== */
.option-input {
  width: 100%;
  min-height: 100px;
  border: 1.5px solid var(--blue-200);
  border-radius: var(--radius-md);
  padding: 14px;
  font-size: 15px;
  font-family: var(--font-stack);
  color: #3A5068;
  background: var(--white-60);
  resize: vertical;
  transition: border-color var(--transition-fast);
  line-height: 1.6;
}
.option-input:focus {
  outline: none;
  border-color: var(--blue-400);
  box-shadow: 0 0 0 3px rgba(126,200,227,0.15);
}
.option-input::placeholder { color: #B0CFD9; }
.input-hint {
  font-size: 11px;
  color: #A0C4D0;
  margin-top: 8px;
  text-align: center;
  margin-bottom: 8px;
}
.preset-btns {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  justify-content: center;
  margin-bottom: 20px;
}
.preset-btn {
  font-size: 12px;
  padding: 6px 14px;
  border-radius: 16px;
  border: 1px solid var(--blue-200);
  background: var(--white-60);
  color: var(--blue-600);
  cursor: pointer;
  font-family: var(--font-stack);
  transition: all var(--transition-fast);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
}
.preset-btn:active { background: var(--blue-100); border-color: var(--blue-400); }

.result-display {
  width: 100%;
  min-height: 56px;
  background: linear-gradient(135deg, var(--blue-100), var(--blue-200));
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
  font-weight: 700;
  color: #2E8CAA;
  margin-top: 16px;
  letter-spacing: 1px;
  transition: all var(--transition-bounce);
  text-align: center;
  padding: 12px;
}
.result-display.rolling-result {
  animation: flashResult 0.6s ease-out;
}
@keyframes flashResult {
  0% { transform: scale(1.05); background: var(--blue-300); }
  100% { transform: scale(1); }
}

/* ========== AI Chat Tab ========== */
.chat-container {
  width: 100%;
  display: flex;
  flex-direction: column;
  height: 380px;
  min-height: 300px;
}
.chat-messages {
  flex: 1;
  overflow-y: auto;
  padding: 4px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 12px;
  -webkit-overflow-scrolling: touch;
}
.chat-messages::-webkit-scrollbar { width: 4px; }
.chat-messages::-webkit-scrollbar-thumb { background: var(--blue-200); border-radius: 2px; }

.chat-bubble {
  max-width: 85%;
  padding: 12px 16px;
  border-radius: 18px;
  font-size: 14px;
  line-height: 1.6;
  animation: fadeSlideIn 0.3s ease-out;
  word-break: break-word;
}
.chat-bubble.assistant {
  align-self: flex-start;
  background: var(--white-85);
  border-bottom-left-radius: 6px;
  color: #3A5068;
}
.chat-bubble.user {
  align-self: flex-end;
  background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
  color: #fff;
  border-bottom-right-radius: 6px;
}
.chat-input-row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.chat-input {
  flex: 1;
  border: 1.5px solid var(--blue-200);
  border-radius: 24px;
  padding: 12px 18px;
  font-size: 14px;
  font-family: var(--font-stack);
  color: #3A5068;
  background: var(--white-60);
  transition: border-color var(--transition-fast);
  min-height: 44px;
}
.chat-input:focus { outline: none; border-color: var(--blue-400); }
.chat-input::placeholder { color: #B0CFD9; }
.chat-send-btn {
  width: 44px;
  height: 44px;
  min-width: 44px;
  border-radius: 50%;
  border: none;
  background: linear-gradient(135deg, var(--blue-400), var(--blue-500));
  color: #fff;
  font-size: 18px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-btn);
  transition: all var(--transition-fast);
  -webkit-tap-highlight-color: transparent;
}
.chat-send-btn:active { transform: scale(0.9); }
.typing-indicator {
  align-self: flex-start;
  padding: 12px 16px;
  background: var(--white-85);
  border-radius: 18px;
  border-bottom-left-radius: 6px;
  display: flex;
  gap: 4px;
  display: none;
}
.typing-indicator.show { display: flex; }
.typing-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--blue-300);
  animation: typingBounce 1.4s ease-in-out infinite;
}
.typing-dot:nth-child(2) { animation-delay: 0.2s; }
.typing-dot:nth-child(3) { animation-delay: 0.4s; }
@keyframes typingBounce {
  0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
  30% { transform: translateY(-6px); opacity: 1; }
}

/* ========== Footer ========== */
.footer {
  margin-top: auto;
  padding: 24px 0 8px;
  text-align: center;
  font-size: 11px;
  color: #A0C4D0;
  letter-spacing: 1px;
  opacity: 0.7;
}

/* ========== Responsive: Desktop ========== */
@media (min-width: 768px) {
  .app-container {
    padding: 40px 24px 40px;
  }
  .card {
    padding: 36px 32px;
  }
  .number-display, .color-display {
    width: 200px;
    height: 200px;
  }
  .number-display .number { font-size: 80px; }
  .tab-btn { padding: 12px 8px; font-size: 14px; }
  .tab-btn .tab-emoji { font-size: 20px; }
  .tab-btn .tab-label { font-size: 12px; }
  .chat-container { height: 420px; }
}

@media (min-width: 1024px) {
  .app-container { max-width: 520px; }
}
</style>
</head>
<body>

<!-- Background Decorations -->
<div class="bg-decoration bg-circle bg-circle-1"></div>
<div class="bg-decoration bg-circle bg-circle-2"></div>
<div class="bg-decoration bg-circle bg-circle-3"></div>
<div class="bg-decoration bg-circle bg-circle-4"></div>
<div class="bg-decoration bg-dot bg-dot-1"></div>
<div class="bg-decoration bg-dot bg-dot-2"></div>
<div class="bg-decoration bg-dot bg-dot-3"></div>
<div class="bg-decoration bg-dot bg-dot-4"></div>
<div class="bg-decoration bg-dot bg-dot-5"></div>

<!-- Main App -->
<div class="app-container">

  <!-- Header -->
  <header class="header">
    <div class="header-icon">🌿</div>
    <h1>随便吧</h1>
    <p class="slogan">把犹豫交给随机，把心情还给治愈</p>
  </header>

  <!-- Tab Navigation -->
  <nav class="tab-nav" id="tabNav">
    <button class="tab-btn active" data-tab="number">
      <span class="tab-emoji">🎲</span>
      <span class="tab-label">随机数字</span>
    </button>
    <button class="tab-btn" data-tab="color">
      <span class="tab-emoji">🎨</span>
      <span class="tab-label">随机颜色</span>
    </button>
    <button class="tab-btn" data-tab="picker">
      <span class="tab-emoji">🎯</span>
      <span class="tab-label">自定义抽取</span>
    </button>
    <button class="tab-btn" data-tab="chat">
      <span class="tab-emoji">🤖</span>
      <span class="tab-label">AI 助手</span>
    </button>
  </nav>

  <!-- Tab 1: Random Number -->
  <section class="tab-content active" id="tab-number">
    <div class="card">
      <div class="number-display" id="numberDisplay">
        <span class="number" id="randomNumber">42</span>
      </div>
      <button class="btn" id="rollBtn" onclick="rollNumber()">🎲 摇一个数字</button>
      <div class="history">
        <div class="history-title">📋 最近记录</div>
        <div class="history-list" id="numberHistory"></div>
      </div>
    </div>
  </section>

  <!-- Tab 2: Random Color -->
  <section class="tab-content" id="tab-color">
    <div class="card">
      <div class="color-display" id="colorDisplay" style="background-color: #7EC8E3;"></div>
      <div class="color-info">
        <div class="color-name-cn" id="colorNameCN">淡蓝</div>
        <div class="color-name-en" id="colorNameEN">Light Blue</div>
        <div class="color-hex" id="colorHex">#7EC8E3</div>
      </div>
      <div class="color-tags" id="colorTags">
        <span class="color-tag">清新</span>
        <span class="color-tag">日常</span>
        <span class="color-tag">春夏</span>
      </div>
      <button class="btn" id="rollColorBtn" style="margin-top:20px;" onclick="rollColor()">🎨 换一个颜色</button>
    </div>
  </section>

  <!-- Tab 3: Custom Picker -->
  <section class="tab-content" id="tab-picker">
    <div class="card">
      <textarea class="option-input" id="optionInput" placeholder="在这里输入你的选项…&#10;每行一个，或者用逗号、空格分隔都可以&#10;&#10;例如：&#10;吃火锅&#10;吃日料&#10;吃烤肉&#10;吃沙拉&#10;不吃"></textarea>
      <p class="input-hint">💡 支持换行 / 逗号 / 中文逗号 / 空格分隔</p>
      <div class="preset-btns">
        <button class="preset-btn" onclick="setPreset('breakfast')">🍳 早餐吃什么</button>
        <button class="preset-btn" onclick="setPreset('drink')">🥤 喝什么</button>
        <button class="preset-btn" onclick="setPreset('activity')">🎮 周末干嘛</button>
        <button class="preset-btn" onclick="setPreset('movie')">🎬 看什么电影</button>
      </div>
      <button class="btn" onclick="rollCustom()">🎯 开始抽取</button>
      <div class="result-display" id="customResult">👆 输入选项后点击抽取</div>
    </div>
  </section>

  <!-- Tab 4: AI Chat -->
  <section class="tab-content" id="tab-chat">
    <div class="card">
      <div class="chat-container">
        <div class="chat-messages" id="chatMessages">
          <div class="chat-bubble assistant">
            👋 嗨～我是你的选择困难小助手！<br><br>
            在纠结什么？把你的选项和顾虑都告诉我吧～<br>
            比如：<br>

function switchTab(tabName) {

  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

// ==================== Tab 1: Random Number ====================
function rollNumber() {
  const display = document.getElementById('numberDisplay');
  const numEl = document.getElementById('randomNumber');
  const rollBtn = document.getElementById('rollBtn');

  // Disable button briefly
  rollBtn.disabled = true;
  rollBtn.style.opacity = '0.6';

  // Shake animation
  display.classList.add('rolling');
  setTimeout(() => display.classList.remove('rolling'), 450);

  // Rolling animation
  const totalFrames = 20;
  let frame = 0;
  const rollInterval = setInterval(() => {
    numEl.textContent = Math.floor(Math.random() * 100) + 1;
    frame++;
    if (frame >= totalFrames) {
      clearInterval(rollInterval);
      // Final number
      const finalNumber = Math.floor(Math.random() * 100) + 1;
      numEl.textContent = finalNumber;

      // Add to history
      numberHistory.unshift(finalNumber);
      if (numberHistory.length > 10) numberHistory.pop();
      renderHistory();

      // Re-enable button
      rollBtn.disabled = false;
      rollBtn.style.opacity = '1';
    }
  }, 50);
}

function renderHistory() {
  const container = document.getElementById('numberHistory');
  container.innerHTML = numberHistory.map(n =>
    `<span class="history-item">${n}</span>`
  ).join('');
}

// ==================== Tab 2: Random Color ====================
function rollColor() {
  const display = document.getElementById('colorDisplay');
  const btn = document.getElementById('rollColorBtn');

  // Disable button during animation
  btn.disabled = true;
  btn.style.opacity = '0.6';

  // Pick final color (ensure different from current)
  let randomIndex;
  let finalColor;
  do {
    randomIndex = Math.floor(Math.random() * colorLibrary.length);
    finalColor = colorLibrary[randomIndex];
  } while (finalColor.hex === currentColor.hex && colorLibrary.length > 1);

  currentColor = finalColor;

  // Rolling animation: rapidly cycle through colors
  const totalFrames = 22;
  let frame = 0;
  display.classList.add('color-rolling');

  const rollInterval = setInterval(() => {
    // Pick a random intermediate color
    const tempColor = colorLibrary[Math.floor(Math.random() * colorLibrary.length)];
    display.style.backgroundColor = tempColor.hex;
    document.getElementById('colorNameCN').textContent = tempColor.cn;
    document.getElementById('colorNameEN').textContent = tempColor.en;
    document.getElementById('colorHex').textContent = tempColor.hex;
    document.getElementById('colorTags').innerHTML = tempColor.tags.map(t =>
      `<span class="color-tag">${t}</span>`
    ).join('');

    frame++;
    if (frame >= totalFrames) {
      clearInterval(rollInterval);

      // Settle on final color
      updateColorDisplay(finalColor);
      display.classList.remove('color-rolling');

      // Pulse on finish
      display.style.transform = 'scale(1.06)';
      setTimeout(() => { display.style.transform = 'scale(1)'; }, 250);

      // Re-enable button
      btn.disabled = false;
      btn.style.opacity = '1';
    }
  }, 55);
}

function updateColorDisplay(color) {
  const display = document.getElementById('colorDisplay');
  display.style.backgroundColor = color.hex;

  document.getElementById('colorNameCN').textContent = color.cn;
  document.getElementById('colorNameEN').textContent = color.en;
  document.getElementById('colorHex').textContent = color.hex;

  const tagsContainer = document.getElementById('colorTags');
  tagsContainer.innerHTML = color.tags.map(t => `<span class="color-tag">${t}</span>`).join('');
}

// ==================== Tab 3: Custom Picker ====================
function setPreset(type) {
  const input = document.getElementById('optionInput');
  input.value = presets[type];
  input.focus();
}

function parseOptions(raw) {
  // Split by newline, Chinese comma, English comma, or Chinese/English semicolon
  // Also split by multiple spaces
  let parts = raw.split(/[\n,，;；]+/);
  // Further split each part by 2+ spaces
  parts = parts.flatMap(p => p.split(/\s{2,}/));
  // Trim and filter empty
  return parts.map(p => p.trim()).filter(p => p.length > 0);
}

function rollCustom() {
  const input = document.getElementById('optionInput');
  const resultEl = document.getElementById('customResult');
  const raw = input.value.trim();

  if (!raw) {
    resultEl.textContent = '😅 请先输入选项再抽取哦～';
    resultEl.classList.add('rolling-result');
    setTimeout(() => resultEl.classList.remove('rolling-result'), 600);
    return;
  }

  const options = parseOptions(raw);

  if (options.length === 0) {
    resultEl.textContent = '😅 没有识别到有效选项，请检查一下～';
    resultEl.classList.add('rolling-result');
    setTimeout(() => resultEl.classList.remove('rolling-result'), 600);
    return;
  }

  if (options.length === 1) {
    resultEl.textContent = `🤷 只有一个选项：「${options[0]}」，不用纠结啦！`;
    resultEl.classList.add('rolling-result');
    setTimeout(() => resultEl.classList.remove('rolling-result'), 600);
    return;
  }

  // Rolling animation through options
  const totalFrames = 25;
  let frame = 0;
  const rollInterval = setInterval(() => {
    const idx = Math.floor(Math.random() * options.length);
    resultEl.textContent = options[idx];
    frame++;
    if (frame >= totalFrames) {
      clearInterval(rollInterval);
      const final = options[Math.floor(Math.random() * options.length)];
      resultEl.textContent = '✨ ' + final + ' ✨';
      resultEl.classList.add('rolling-result');
      setTimeout(() => resultEl.classList.remove('rolling-result'), 600);
    }
  }, 40);
}

// ========== 配置区 ==========
// 把下面这行替换成你自己的 API Key（从 open.bigmodel.cn 获取）
const GLM_API_KEY = 'b6974596a634480eb3804bf03f8a145b.daapMlazy4lXRrjP';

// 模型选择：glm-4-flash 是免费模型，glm-4 是付费旗舰模型
const GLM_MODEL = 'glm-4-flash';

// AI 人设（系统提示词）—— 可以按自己的喜好修改
const SYSTEM_PROMPT = `你是一个温暖治愈的"选择困难小助手"。
你的任务不是替用户做决定，而是像一个温柔的朋友一样，帮他们梳理思路、分析利弊。

回复要求：
1. 先共情，理解用户的纠结
2. 帮用户从不同角度分析（理性/感性、短期/长期等），但不要太啰嗦

4. 语气温暖亲切，可以适当用 emoji
5. 回复控制在 300 字以内，简洁有力
6. 绝对不能说"随便""都可以"这种敷衍的话`;

// ========== 降级回复（API 挂了时的保底） ==========
const FALLBACK_RESPONSES = [
  '好的，我理解你的纠结了～ 🤔\n\n其实面对选择时感到犹豫是很正常的。让我帮你梳理一下：看你的描述，你内心似乎更倾向于安全感多一些。\n\n如果非要二选一的话，我会建议你选那个让你「即使失败了也不会太后悔」的选项。\n\n这只是参考建议哦，最终决定权在你手里 💙',
  '听你这么一说，我觉得这件事可以从另一个角度来看～ 🌟\n\n纠结的本质往往是「怕选错」，但实际上大多数选择没有绝对的对错。\n\n不妨试试问自己：如果只有一个选择，我会感到遗憾吗？\n\n希望对你有帮助，相信你的直觉！',
  '我感受到了你的为难～ 😊\n\n要不试试「抛硬币法」？不是说真的靠硬币决定，而是在硬币飞起的瞬间，你心里会希望它落在哪一面——那就是你真实的想法。\n\n不管怎样，做决定本身就是一种勇气！'
];

async function sendMessage() {
  const input = document.getElementById('chatInput');
  const messages = document.getElementById('chatMessages');
  const typingIndicator = document.getElementById('typingIndicator');
  const text = input.value.trim();

  if (!text) return;

  // Add user message
  const userBubble = document.createElement('div');
  userBubble.className = 'chat-bubble user';
  userBubble.textContent = text;
  messages.appendChild(userBubble);
  input.value = '';
  messages.scrollTop = messages.scrollHeight;

  // Show typing indicator
  typingIndicator.classList.add('show');
  messages.scrollTop = messages.scrollHeight;

  let replyText = '';

  // Check if API key is configured
  if (!GLM_API_KEY || GLM_API_KEY === '你的API_KEY填在这里') {
    // No API key — use fallback
    await sleep(1500);
    replyText = FALLBACK_RESPONSES[Math.floor(Math.random() * FALLBACK_RESPONSES.length)];
  } else {
    // Call Zhipu GLM API
    try {
      const response = await fetch('https://open.bigmodel.cn/api/paas/v4/chat/completions', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + GLM_API_KEY
        },
        body: JSON.stringify({
          model: GLM_MODEL,
          messages: [
            { role: 'system', content: SYSTEM_PROMPT },
            { role: 'user', content: text }
          ],
          temperature: 0.7,
          max_tokens: 800
        })
      });

      const data = await response.json();

      if (data.choices && data.choices[0] && data.choices[0].message) {
        replyText = data.choices[0].message.content;
      } else {
        // API returned unexpected format
        console.error('GLM API 返回格式异常:', data);
        throw new Error('API response format error');
      }
    } catch (error) {
      // API call failed — use fallback
      console.error('GLM API 调用失败:', error);
      replyText = '😅 抱歉，AI 服务暂时不可用…\n\n可能是网络问题或 API Key 余额不足。\n\n以下是随机建议：\n' +
        FALLBACK_RESPONSES[Math.floor(Math.random() * FALLBACK_RESPONSES.length)];
    }
  }

  // Hide typing indicator and show reply
  typingIndicator.classList.remove('show');

  const aiBubble = document.createElement('div');
  aiBubble.className = 'chat-bubble assistant';
  aiBubble.textContent = replyText;
  messages.appendChild(aiBubble);
  messages.scrollTop = messages.scrollHeight;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}
